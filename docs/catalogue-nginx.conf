# PUBLIC ACCESS IS FORBIDDEN. This is a deny rule, NOT a dashboard proxy.
# The dashboard stays on 127.0.0.1:8777 and is reachable only through Tailscale Serve.
# Keep this block in the public site to prevent fallback routes exposing it.
location = /catalogue {
    return 404;
}

location ^~ /catalogue/ {
    return 404;
}
