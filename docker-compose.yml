# Wastaken Upload Assistant — persistent local WebUI deployment.
# Start with: docker compose up -d --build
#
# This is the canonical deployment for the host setup used with Qui. The
# container shares gluetun_seeding's network namespace, so Qui continues to
# reach the WebUI at http://172.60.0.1:5000 without changing its external
# program definitions.
services:
  upload-assistant-wastaken:
    image: upload-assistant-wastaken:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upload-assistant-wastaken
    restart: unless-stopped
    network_mode: "container:gluetun_seeding"
    command: ["--webui", "0.0.0.0:5000"]
    environment:
      PUID: "1000"
      PGID: "1000"
      UA_BROWSE_ROOTS: "/mnt/seeding"
      UA_WEBUI_USE_SUBPROCESS: "1"
      TMPDIR: "/Upload-Assistant/tmp"
      MPLCONFIGDIR: "/Upload-Assistant/tmp/matplotlib"
      XDG_CACHE_HOME: "/Upload-Assistant/tmp/.cache"
    volumes:
      - /mnt/seeding:/mnt/seeding:rw
      - ./docker-data/data:/Upload-Assistant/data:rw
      - ./docker-data/tmp:/Upload-Assistant/tmp:rw
      - ./docker-data/webui-auth:/root/.config/upload-assistant:rw
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "upload-assistant-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
