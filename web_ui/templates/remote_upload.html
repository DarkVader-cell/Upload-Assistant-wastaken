<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Remote uploads</title></head>
<body><a href="/">Back to UA</a><h1>Remote uploads</h1>
<p>Copies to the selected host, creates torrents there, then returns verified registrations to existing local payloads. Originals are retained.</p>
<form id="remote-form"><label>Backend <select id="backend" required></select></label><br>
<label>Dedicated source path <input id="source" required size="70"></label><br>
<label>Trackers (comma-separated) <input id="trackers" required placeholder="PTP,HDB"></label><br>
<label>Remote seed interval (hours) <input id="hours" type="number" min="0" step="0.1" value="24" required></label><br>
<button type="submit">Stage and upload</button></form>
<p>Unattended jobs require an SSH key. Review-required tracker uploads are not forced.</p>
<button id="refresh">Refresh status</button> <button id="tick">Process due returns now</button>
<p id="message" role="status"></p><pre id="status"></pre>
<script src="{{ url_for('static', filename='js/remote_upload.js') }}" defer></script></body></html>
