name: Create and publish Docker images

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/fork-sync/**"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      use_latest_tag:
        description: "Tag as latest instead of branch name"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image_name: ${{ steps.image-name.outputs.image_name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      amd64_runner: ${{ steps.runner.outputs.label }}
    steps:
      - name: Compute lowercase image name
        id: image-name
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.use_latest_tag == true) }},priority=1000
            type=ref,event=tag
            type=ref,event=branch,enable=${{ !inputs.use_latest_tag }}

      - name: Select preferred amd64 self-hosted runner
        id: runner
        env:
          RUNNER_SELECTION_TOKEN: ${{ secrets.RUNNER_SELECTION_TOKEN }}
        run: |
          if [ -z "${RUNNER_SELECTION_TOKEN}" ]; then
            echo "label=ubuntu-24.04" >> "$GITHUB_OUTPUT"
            echo "RUNNER_SELECTION_TOKEN is not configured; using hosted amd64."
            exit 0
          fi

          if ! runners="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${RUNNER_SELECTION_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"; then
            echo "label=ubuntu-24.04" >> "$GITHUB_OUTPUT"
            echo "Runner discovery failed; using hosted amd64."
            exit 0
          fi

          if jq -e '.runners[] | select(.status == "online") | .labels[] | select(.name == "windows-docker-primary")' <<<"$runners" >/dev/null; then
            echo "label=windows-docker-primary" >> "$GITHUB_OUTPUT"
            echo "Using the online Windows Docker runner."
          elif jq -e '.runners[] | select(.status == "online") | .labels[] | select(.name == "homelab-docker-fallback")' <<<"$runners" >/dev/null; then
            echo "label=homelab-docker-fallback" >> "$GITHUB_OUTPUT"
            echo "Windows runner is offline; using the homelab Docker runner."
          else
            echo "label=ubuntu-24.04" >> "$GITHUB_OUTPUT"
            echo "No configured self-hosted Docker runner is online; using hosted amd64."
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: webui
            dockerfile: ./Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ${{ needs.prepare.outputs.amd64_runner }}
          - variant: webui
            dockerfile: ./Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (${{ matrix.variant }} / ${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "/tmp/digests/${{ matrix.variant }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.variant }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests/webui
        run: |
          docker buildx imagetools create \
            $(echo "$TAGS" | xargs -I {} echo -t {}) \
            $(printf '${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}@sha256:%s ' *)
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}

      - name: Output build information
        run: |
          echo "✅ Docker images built and pushed successfully!"
          echo "🐋 Images:"
          echo '${{ needs.prepare.outputs.tags }}' | sed 's/^/  - /'
          echo "📝 Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "📝 Triggered by release: ${{ github.event.release.tag_name }}"
          else
            echo "📝 Triggered by manual workflow dispatch on branch: ${{ github.ref_name }}"
          fi
