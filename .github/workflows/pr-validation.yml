name: PR validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python 3.14 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Verify dependency files
        shell: bash
        run: |
          uv lock --check
          uv export --format requirements-txt --no-hashes --no-emit-project --no-header --no-annotate --output-file "$RUNNER_TEMP/requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Verify dependency files
        shell: bash
        run: |
          uv lock --check
          uv export --format requirements-txt --no-hashes --no-emit-project --no-header --no-annotate --output-file "$RUNNER_TEMP/requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build package wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify package assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          package_data = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["setuptools"]["package-data"]
          required = {
              path.as_posix()
              for package, patterns in package_data.items()
              for pattern in patterns
              for path in Path(package).glob(pattern)
              if path.is_file() and not path.name.startswith(".")
          }
          with ZipFile(wheel) as archive:
              members = set(archive.namelist())
              missing = required - members
          if missing:
              raise SystemExit(f"Wheel is missing: {', '.join(sorted(missing))}")
          forbidden = {"data/config.py", "requirements.txt"} & members
          if forbidden:
              raise SystemExit(f"Wheel contains local-only files: {', '.join(sorted(forbidden))}")
          PY

      - name: Compile Python sources
        run: python -m compileall src web_ui upload.py config-generator.py

      - name: Check architecture boundaries
        run: python scripts/architecture_guard.py

      - name: Run runtime benchmark smoke test
        run: python benchmarks/benchmark_runtime.py --smoke

  tests:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu
            runner: ubuntu-24.04
          - os: Windows
            runner: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Create test configuration
        shell: pwsh
        run: Copy-Item data/example_config.py data/config.py

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  docker-build:
    name: Docker build validation (${{ matrix.arch }})
    needs: python-compatibility
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          tags: upload-assistant-pr:${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=pr-webui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-webui-${{ matrix.arch }}
          load: true
          push: false

      - name: Validate Docker runtime and image size
        shell: bash
        run: |
          image="upload-assistant-pr:${{ matrix.arch }}"
          size="$(docker image inspect "$image" --format '{{.Size}}')"
          max_size=1500000000
          echo "Image size: $size bytes (limit: $max_size bytes)"
          test "$size" -le "$max_size"
          docker run --rm --entrypoint python "$image" -c "import flask, httpx, numpy, PIL; print('Python runtime imports OK')"
          docker run --rm --entrypoint sh "$image" -c '
            command -v ffmpeg >/dev/null
            command -v mediainfo >/dev/null
            command -v gosu >/dev/null
            command -v curl >/dev/null
            command -v upload-assistant-healthcheck >/dev/null
            test "$(find /Upload-Assistant/bin/mkbrr -type f -name mkbrr -perm /111 | wc -l)" -eq 1
            test "$(find /Upload-Assistant/bin/bdinfo -type f -name bdinfo -perm /111 | wc -l)" -eq 1
            test -x /Upload-Assistant/bin/MI/linux/mediainfo
            test ! -e /Upload-Assistant/data/config.py
            ! command -v cargo >/dev/null
            ! command -v rustc >/dev/null
            ! command -v g++ >/dev/null
          '
