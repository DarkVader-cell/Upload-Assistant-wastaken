name: Sync Wastaken development

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-wastaken
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout wastaken
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Wastaken development
        run: git fetch --no-tags https://github.com/wastaken7/Upload-Assistant.git refs/heads/development:refs/remotes/wastaken7/development

      - name: Merge Wastaken development
        id: sync
        run: |
          current=$(git rev-parse dev)
          latest=$(git rev-parse wastaken7/development)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dev is already current."
            exit 0
          fi

          if git merge-base --is-ancestor "$latest" "$current"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dev already contains Wastaken development."
            exit 0
          fi

          if git merge --no-edit --no-ff "$latest"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "diverged=true" >> "$GITHUB_OUTPUT"
            echo "dev contains local changes that cannot be merged automatically."
            exit 1
          fi

      - name: Push fast-forward
        if: steps.sync.outputs.changed == 'true'
        run: git push origin dev

      - name: Report divergence
        if: failure() && steps.sync.outputs.diverged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Wastaken sync blocked: dev branch diverged';
            const body = [
              'The hourly sync could not merge `wastaken7/Upload-Assistant:development` into `dev` without manual resolution.',
              '',
              `Current branch: \`${{ steps.sync.outputs.current }}\``,
              `Wastaken development: \`${{ steps.sync.outputs.latest }}\``,
              '',
              'Resolve the divergence manually, then close this issue.'
            ].join('\\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
